steps:
  - name: version
    image: alpine
    commands:
      - 'apk add --no-cache make'
      - 'make ci-version'

  - name: build
    image: git.teletypegames.org/internal/c64-builder:latest
    commands:
      - 'make ci-build'

  - name: artifact
    image: alpine
    environment:
      UPDATE_SERVER: https://teletypegames.org
      UPDATE_SECRET:
        from_secret: update_secret_key
    commands:
      - 'apk add --no-cache make curl'
      - 'make ci-artifact'

  - name: publish
    image: alpine
    environment:
      UPDATE_SERVER: https://teletypegames.org
      UPDATE_SECRET:
        from_secret: update_secret_key
    commands:
      - 'apk add --no-cache make curl'
      - 'make ci-publish'
